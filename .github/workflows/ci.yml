name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@v4

      # pnpm must be installed before setup-node can cache its store.
      # Its version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @fieldtest/core --filter @fieldtest/registry lint
      - run: pnpm test
